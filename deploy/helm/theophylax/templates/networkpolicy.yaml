{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "theophylax.fullname" . }}
  labels: {{- include "theophylax.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "theophylax.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ port: 8080 }]
  egress:
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - ports: [{ port: 5432 }, { port: 443 }, { port: 3128 }, { port: 8080 }]
{{- end }}
