apiVersion: v1
kind: Service
metadata:
  name: {{ include "theophylax.fullname" . }}
  labels: {{- include "theophylax.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
  selector: {{- include "theophylax.selector" . | nindent 4 }}
